<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ゆうゆうプラザ 元取れたか カレンダー</title>
<style>
  :root{
    --bg:#f3f7f4;
    --card:#ffffff;
    --ink:#1f3d2b;
    --sub:#6b8475;
    --green:#2e9e5b;
    --green-d:#1f7a44;
    --gold:#e0a325;
    --red:#d2553f;
    --line:#e2ece5;
    --shadow:0 2px 10px rgba(31,61,43,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);color:var(--ink);padding:14px 12px 60px;line-height:1.5;
  }
  h1{font-size:1.18rem;margin:0 0 2px;display:flex;align-items:center;gap:7px;}
  .tagline{font-size:.78rem;color:var(--sub);margin:0 0 14px;}
  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}

  /* サマリー */
  .summary{text-align:center;}
  .verdict{font-size:1.55rem;font-weight:800;margin:2px 0 4px;}
  .verdict.win{color:var(--green-d);}
  .verdict.lose{color:var(--red);}
  .verdict small{display:block;font-size:.72rem;font-weight:600;color:var(--sub);margin-top:3px;}
  .bar{height:14px;background:var(--line);border-radius:8px;overflow:hidden;margin:12px 0 6px;}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-d));width:0;transition:width .4s ease;}
  .bar.over>i{background:linear-gradient(90deg,var(--gold),#c98a12);}
  .barlabel{font-size:.74rem;color:var(--sub);}
  .stats{display:flex;gap:8px;margin-top:14px;}
  .stat{flex:1;background:var(--bg);border-radius:12px;padding:9px 4px;}
  .stat b{display:block;font-size:1.15rem;color:var(--ink);}
  .stat span{font-size:.68rem;color:var(--sub);}

  /* カレンダー */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .calhead button{border:none;background:var(--bg);color:var(--ink);font-size:1.1rem;width:38px;height:38px;border-radius:10px;}
  .calhead .mlabel{font-weight:700;font-size:1.05rem;}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.7rem;color:var(--sub);margin-bottom:4px;}
  .dow span:first-child{color:#d2553f;}
  .dow span:last-child{color:#3f7bd2;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .day{aspect-ratio:1/1;border-radius:11px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.85rem;position:relative;border:1.5px solid transparent;}
  .day.empty{background:transparent;}
  .day.out{opacity:.32;}
  .day.today{border-color:var(--gold);}
  .day.went{background:var(--green);color:#fff;font-weight:700;}
  .day.went::after{content:"✓";position:absolute;bottom:2px;font-size:.62rem;opacity:.9;}
  .day.sun{color:#d2553f;}
  .day.sat{color:#3f7bd2;}
  .day.went.sun,.day.went.sat{color:#fff;}
  .hint{font-size:.72rem;color:var(--sub);text-align:center;margin-top:10px;}

  /* 設定 */
  details{margin-bottom:14px;}
  summary{cursor:pointer;font-weight:700;font-size:.92rem;padding:12px 16px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);list-style:none;}
  summary::-webkit-details-marker{display:none;}
  summary::before{content:"⚙️ ";}
  .settings{background:var(--card);border-radius:0 0 14px 14px;margin-top:-8px;padding:18px 16px 16px;box-shadow:var(--shadow);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:.78rem;color:var(--sub);margin-bottom:4px;}
  .field input{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-size:1rem;background:#fff;color:var(--ink);}
  .row{display:flex;gap:10px;}
  .row .field{flex:1;}
  .btns{display:flex;gap:8px;margin-top:6px;}
  .btn{flex:1;border:none;border-radius:10px;padding:11px;font-size:.85rem;font-weight:700;}
  .btn.ghost{background:var(--bg);color:var(--ink);}
  .btn.save{background:var(--green);color:#fff;}
  .note{font-size:.72rem;color:var(--sub);margin-top:8px;}
  .foot{text-align:center;font-size:.7rem;color:var(--sub);margin-top:18px;}
</style>
</head>
<body>

<h1>♨️ ゆうゆうプラザ 元取れ計</h1>
<p class="tagline">行った日にタップ。半年券の元が取れたか一目で。</p>

<div class="card summary">
  <div id="verdict" class="verdict">—</div>
  <div class="bar" id="bar"><i id="barFill"></i></div>
  <div class="barlabel" id="barLabel"></div>
  <div class="stats">
    <div class="stat"><b id="sVisits">0</b><span>行った回数</span></div>
    <div class="stat"><b id="sPerVisit">¥0</b><span>1回あたり</span></div>
    <div class="stat"><b id="sBreakeven">0</b><span>元取れまで</span></div>
  </div>
</div>

<div class="card">
  <div class="calhead">
    <button id="prev">‹</button>
    <div class="mlabel" id="mlabel"></div>
    <button id="next">›</button>
  </div>
  <div class="dow"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
  <div class="grid" id="grid"></div>
  <div class="hint">日付をタップで「行った」を記録 / もう一度で取り消し</div>
</div>

<details>
  <summary>設定（券のねだん・期間）</summary>
  <div class="settings">
    <div class="field">
      <label>半年券のねだん（円）</label>
      <input type="number" id="cfgPass" inputmode="numeric" placeholder="例: 31000">
    </div>
    <div class="field">
      <label>1回ぶんのねだん（円）</label>
      <input type="number" id="cfgUnit" inputmode="numeric" placeholder="520">
    </div>
    <div class="row">
      <div class="field">
        <label>使い始め（有効開始日）</label>
        <input type="date" id="cfgStart">
      </div>
      <div class="field">
        <label>有効終了日</label>
        <input type="date" id="cfgEnd">
      </div>
    </div>
    <div class="btns">
      <button class="btn save" id="saveCfg">保存する</button>
    </div>
    <div class="btns">
      <button class="btn ghost" id="backup">バックアップ書き出し</button>
      <button class="btn ghost" id="restore">読み込み</button>
    </div>
    <input type="file" id="fileInput" accept="application/json" style="display:none">
    <p class="note">記録はこの端末のブラウザに保存されます。機種変更や消去に備え、ときどき「バックアップ書き出し」をおすすめします。</p>
  </div>
</details>

<div class="foot">ゆうゆうプラザ 元取れ計</div>

<script src="data-safety.js"></script>
<script>
const KEY = "yuyu-plaza-v1";
const todayStr = (()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();

const def = {
  pass: 21840,
  unit: 520,
  start: "2026-06-10",
  end: "2026-12-10",
  days: {}   // "2026-06-17": true
};

let state = load();
let view = new Date(new Date().getFullYear(),new Date().getMonth(),1); // 常に月初

function validateState(s){
  SafeData.requireValue(SafeData.record(s) && SafeData.record(s.days),'バックアップ');
  const next={pass:SafeData.number(s.pass,'回数券代',0),unit:SafeData.number(s.unit,'1回の料金',1),start:SafeData.date(s.start,'開始日',true),end:SafeData.date(s.end,'終了日',true),days:{}};
  SafeData.requireValue(!next.start || !next.end || next.start<=next.end,'有効期間');
  for(const [d,went] of Object.entries(s.days)){SafeData.date(d,'利用日');SafeData.requireValue(typeof went==='boolean','利用記録');if(went)next.days[d]=true;}
  return next;
}
function load(){ return SafeData.load(KEY,JSON.parse(JSON.stringify(def)),validateState); }
function save(){ SafeData.persist({[KEY]:state}); }

function fmtMoney(n){ return "¥"+Math.round(n).toLocaleString("ja-JP"); }

function inRange(ds){
  if(state.start && ds < state.start) return false;
  if(state.end && ds > state.end) return false;
  return true;
}

function render(){
  // ---- サマリー計算 ----
  const visits = Object.keys(state.days).filter(d=>state.days[d] && inRange(d)).length;
  const value = visits * state.unit;          // 受けた価値
  const diff = value - state.pass;            // 得 or 損
  const breakeven = Math.max(0, Math.ceil(state.pass / state.unit) - visits);
  const perVisit = visits>0 ? state.pass / visits : 0;

  const v = document.getElementById("verdict");
  if(diff >= 0){
    v.className = "verdict win";
    v.innerHTML = "+"+fmtMoney(diff)+" お得！<small>すでに元は取れています 🎉</small>";
  }else{
    v.className = "verdict lose";
    v.innerHTML = "あと "+fmtMoney(-diff)+"<small>で元が取れます（あと"+breakeven+"回）</small>";
  }

  const pct = Math.min(100, state.pass>0 ? value/state.pass*100 : 0);
  const bar = document.getElementById("bar");
  bar.classList.toggle("over", diff>=0);
  document.getElementById("barFill").style.width = pct+"%";
  document.getElementById("barLabel").textContent =
    fmtMoney(value)+" / "+fmtMoney(state.pass)+"（"+Math.round(value/Math.max(1,state.pass)*100)+"%）";

  document.getElementById("sVisits").textContent = visits+"回";
  document.getElementById("sPerVisit").textContent = visits>0 ? fmtMoney(perVisit) : "—";
  document.getElementById("sBreakeven").textContent = diff>=0 ? "達成✓" : "あと"+breakeven+"回";

  // ---- カレンダー ----
  const y = view.getFullYear(), m = view.getMonth();
  document.getElementById("mlabel").textContent = y+"年 "+(m+1)+"月";
  const first = new Date(y,m,1).getDay();
  const dim = new Date(y,m+1,0).getDate();
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for(let i=0;i<first;i++){ const e=document.createElement("div"); e.className="day empty"; grid.appendChild(e); }
  for(let d=1;d<=dim;d++){
    const ds = y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const cell = document.createElement("div");
    cell.className = "day";
    const dow = new Date(y,m,d).getDay();
    if(dow===0) cell.classList.add("sun");
    if(dow===6) cell.classList.add("sat");
    if(ds===todayStr) cell.classList.add("today");
    if(!inRange(ds)){cell.classList.add('out');cell.setAttribute('aria-disabled','true');cell.title='有効期間外です';}
    if(state.days[ds]) cell.classList.add("went");
    cell.textContent = d;
    cell.onclick = ()=>{
      if(!inRange(ds) || !SafeData.writable())return;
      if(state.days[ds]) delete state.days[ds];
      else state.days[ds] = true;
      save(); render();
    };
    grid.appendChild(cell);
  }
}

document.getElementById("prev").onclick = ()=>{ view = new Date(view.getFullYear(),view.getMonth()-1,1); render(); };
document.getElementById("next").onclick = ()=>{ view = new Date(view.getFullYear(),view.getMonth()+1,1); render(); };

// 設定フォーム
function fillCfg(){
  document.getElementById("cfgPass").value = state.pass;
  document.getElementById("cfgUnit").value = state.unit;
  document.getElementById("cfgStart").value = state.start;
  document.getElementById("cfgEnd").value = state.end;
}
document.getElementById("saveCfg").onclick = ()=>{
  if(!SafeData.writable())return;
  try{
    const next=validateState({pass:Number(document.getElementById('cfgPass').value),unit:Number(document.getElementById('cfgUnit').value),start:document.getElementById('cfgStart').value,end:document.getElementById('cfgEnd').value,days:state.days});
    SafeData.persist({[KEY]:next});state=next;
  }catch(err){alert(err.message);return;}
  render();
  const b=document.getElementById("saveCfg"); b.textContent="保存しました ✓";
  setTimeout(()=>b.textContent="保存する",1200);
};

// バックアップ
document.getElementById("backup").onclick = ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "yuyu-plaza-backup-"+todayStr+".json";
  a.click();
};
document.getElementById("restore").onclick = ()=> document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = (e)=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const next = validateState(JSON.parse(r.result));
      if(!confirm('現在の設定と利用記録をバックアップの内容で置き換えますか？'))return;
      SafeData.persist({[KEY]:next},true);state=next;
      fillCfg(); render();
      alert("読み込みました。");
    }catch(err){ alert("復元できませんでした。元のデータは変更していません。"); }
  };
  r.readAsText(f);e.target.value="";
};

fillCfg();
render();
</script>
</body>
</html>
